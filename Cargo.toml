[package]
name = "x-ziwei"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Zi Wei Dou Shu MCP and HTTP service: charts from x-iztro, readings from knowledge packs"
repository = "https://github.com/x-haose/x-ziwei"
readme = "README.md"
keywords = ["ziwei", "iztro", "mcp", "astrology"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
governor = "0.10"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.2.0", features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-std", "net", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
x-iztro = { version = "0.6.1", git = "https://github.com/x-haose/x-iztro", rev = "1b73cbcc01e550cb2c2e9dc90f45baaa7a421c04" }

[dev-dependencies]
http-body-util = "0.1"
pretty_assertions = "1"
tower = { version = "0.5", features = ["util"] }
