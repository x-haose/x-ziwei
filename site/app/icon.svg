<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    站点图标：十二宫方盘围着紫微（北极）星，与插件图标 plugin/assets/icon.svg 是同一幅图。
    星形与导航栏 Logo（components/logo.tsx）同一 path；
    颜色为 global.css 品牌 oklch 令牌的 sRGB 值（favicon 消费方未必支持 oklch）。
    apple-icon.png 是本图去掉圆角后的 360×360 渲染（iOS 自己裁圆角，图上不能有透明角）。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1630"/>
      <stop offset=".55" stop-color="#090d17"/>
      <stop offset="1" stop-color="#03060d"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g fill="#b48df4" opacity=".62">
    <rect x="10" y="10" width="9.5" height="9.5" rx="2"/>
    <rect x="21.5" y="10" width="9.5" height="9.5" rx="2"/>
    <rect x="33" y="10" width="9.5" height="9.5" rx="2"/>
    <rect x="44.5" y="10" width="9.5" height="9.5" rx="2"/>
    <rect x="10" y="21.5" width="9.5" height="9.5" rx="2"/>
    <rect x="44.5" y="21.5" width="9.5" height="9.5" rx="2"/>
    <rect x="10" y="33" width="9.5" height="9.5" rx="2"/>
    <rect x="44.5" y="33" width="9.5" height="9.5" rx="2"/>
    <rect x="10" y="44.5" width="9.5" height="9.5" rx="2"/>
    <rect x="21.5" y="44.5" width="9.5" height="9.5" rx="2"/>
    <rect x="33" y="44.5" width="9.5" height="9.5" rx="2"/>
    <rect x="44.5" y="44.5" width="9.5" height="9.5" rx="2"/>
  </g>
  <path transform="translate(18.2 19.35) scale(1.15)" fill="#ebbd57"
    d="M12 2.5 13.9 9.2 20.5 11 13.9 12.8 12 19.5 10.1 12.8 3.5 11 10.1 9.2Z"/>
</svg>
